<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Online Quiz</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <style>
      :root {
        --bg: #f3f5f9;
        --card: #fff;
        --ink: #1c2333;
        --muted: #5d6579;
        --line: #d9deea;
        --accent: #2f5bea;
        --bad: #c62828;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.5;
        -webkit-user-select: none;
        user-select: none;
      }
      input {
        -webkit-user-select: text;
        user-select: text;
      }
      .wrap {
        max-width: 640px;
        margin: 0 auto;
        padding: 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 14px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 6px;
      }
      h2 {
        font-size: 1.05rem;
        margin: 0 0 12px;
      }
      p.muted {
        color: var(--muted);
        margin: 0 0 14px;
      }
      label.f {
        display: block;
        font-weight: 600;
        margin: 12px 0 4px;
      }
      input[type="text"] {
        width: 100%;
        padding: 12px;
        font-size: 1rem;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      input[type="text"]:focus,
      button:focus-visible,
      .opt:focus-within {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 12px 20px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        margin-top: 16px;
      }
      button:disabled {
        opacity: 0.5;
      }
      .opt {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      .opt input {
        margin-top: 4px;
      }
      .opt:has(input:checked) {
        border-color: var(--accent);
        background: #eef2ff;
      }
      .err {
        color: var(--bad);
        font-weight: 600;
        margin-top: 10px;
      }
      .bar {
        position: sticky;
        top: 0;
        background: var(--bg);
        padding: 8px 0;
        display: flex;
        justify-content: space-between;
        font-size: 0.9rem;
        color: var(--muted);
        z-index: 5;
      }
      .warn {
        color: var(--bad);
        font-weight: 700;
      }
      .hidden {
        display: none !important;
      }
      #overlay {
        position: fixed;
        inset: 0;
        background: rgba(120, 10, 10, 0.94);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        z-index: 99;
      }
      #overlay button {
        background: #fff;
        color: #7a0a0a;
      }
      .score {
        font-size: 2.4rem;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- 1. Student details -->
      <div id="screen-start" class="card">
        <h1 id="quizTitle">Online Quiz</h1>
        <p class="muted">Enter your details to begin. You can only take this quiz once.</p>
        <label class="f" for="fullName">Full name</label>
        <input id="fullName" type="text" autocomplete="off" placeholder="Last name, First name, M.I." />
        <label class="f" for="idNumber">ID number</label>
        <input id="idNumber" type="text" autocomplete="off" inputmode="text" placeholder="e.g. 2024-00123" />
        <div class="card" style="background: #fff8e1; margin: 16px 0 0; font-size: 0.92rem">
          <strong>Rules:</strong> Stay on this page. Switching tabs, opening other apps, or leaving the screen is recorded. You get <b id="maxWarn"></b> warnings; after that your quiz is submitted
          automatically.
        </div>
        <button id="startBtn">Start quiz</button>
        <div id="startErr" class="err"></div>
      </div>

      <!-- 2. Quiz -->
      <div id="screen-quiz" class="hidden">
        <div class="bar">
          <span id="who"></span><span>Warnings: <span id="wcount" class="warn">0</span></span>
        </div>
        <div id="qlist"></div>
        <button id="submitBtn">Submit answers</button>
        <div id="quizErr" class="err"></div>
      </div>

      <!-- 3. Result -->
      <div id="screen-done" class="card hidden" style="text-align: center">
        <h1>Submitted</h1>
        <div class="score" id="scoreText"></div>
        <p class="muted" id="doneNote"></p>
      </div>
    </div>

    <!-- Warning shown when the student leaves the page -->
    <div id="overlay" class="hidden" role="alertdialog" aria-live="assertive">
      <h1>You left the quiz page</h1>
      <p id="overlayMsg"></p>
      <button id="overlayBtn">Return to quiz</button>
    </div>

    <script>
      /* ========= CONFIG: paste your Supabase values ========= */
      const SUPABASE_URL = "https://oaloftnasuimuouhgbtj.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hbG9mdG5hc3VpbXVvdWhnYnRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1OTMwNDIsImV4cCI6MjEwNjE2OTA0Mn0.8bVt2ytMVzg5zOzfapjsIhQa9TtlUo84nW0DhWSHrJM";
      const QUIZ_TITLE = "Midterm Quiz";
      const MAX_WARNINGS = 3; // on warning number MAX_WARNINGS + 1 the quiz auto-submits
      /* ====================================================== */

      const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const $ = (id) => document.getElementById(id);
      let questions = [],
        student = {},
        violations = 0,
        active = false,
        finished = false,
        lastFlag = 0;

      $("quizTitle").textContent = QUIZ_TITLE;
      document.title = QUIZ_TITLE;
      $("maxWarn").textContent = MAX_WARNINGS;

      function show(id) {
        ["screen-start", "screen-quiz", "screen-done"].forEach((s) => $(s).classList.add("hidden"));
        $(id).classList.remove("hidden");
      }

      /* ---------- Start ---------- */
      $("startBtn").onclick = async () => {
        const name = $("fullName").value.trim().replace(/\s+/g, " ");
        const id = $("idNumber").value.trim();
        $("startErr").textContent = "";
        if (name.length < 5 || !name.includes(" ")) return ($("startErr").textContent = "Enter your full name (first and last).");
        if (id.length < 3) return ($("startErr").textContent = "Enter your ID number.");

        $("startBtn").disabled = true;
        try {
          const { data: taken, error: e1 } = await db.rpc("has_submitted", { p_id_number: id });
          if (e1) throw e1;
          if (taken) throw new Error("This ID number has already submitted the quiz.");

          const { data, error: e2 } = await db.rpc("get_questions");
          if (e2) throw e2;
          if (!data || !data.length) throw new Error("No questions available yet.");

          student = { name, id };
          questions = data;
          renderQuiz();
          show("screen-quiz");
          active = true;
          if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
        } catch (e) {
          $("startErr").textContent = e.message || "Something went wrong. Check your connection and try again.";
        }
        $("startBtn").disabled = false;
      };

      function renderQuiz() {
        $("who").textContent = student.name + " · " + student.id;
        $("qlist").innerHTML = "";
        questions.forEach((q, i) => {
          const c = document.createElement("div");
          c.className = "card";
          const h = document.createElement("h2");
          h.textContent = i + 1 + ". " + q.question; // textContent prevents HTML injection
          c.appendChild(h);
          [
            ["A", q.option_a],
            ["B", q.option_b],
            ["C", q.option_c],
            ["D", q.option_d],
          ].forEach(([k, txt]) => {
            const l = document.createElement("label");
            l.className = "opt";
            const r = document.createElement("input");
            r.type = "radio";
            r.name = "q" + q.id;
            r.value = k;
            const s = document.createElement("span");
            s.textContent = k + ". " + txt;
            l.append(r, s);
            c.appendChild(l);
          });
          $("qlist").appendChild(c);
        });
      }

      function collect() {
        const a = {};
        questions.forEach((q) => {
          const v = document.querySelector('input[name="q' + q.id + '"]:checked');
          if (v) a[q.id] = v.value;
        });
        return a;
      }

      /* ---------- Submit ---------- */
      async function finish(auto) {
        if (finished) return;
        finished = true;
        active = false;
        $("overlay").classList.add("hidden");
        $("submitBtn").disabled = true;
        try {
          const { data, error } = await db.rpc("submit_quiz", {
            p_full_name: student.name,
            p_id_number: student.id,
            p_answers: collect(),
            p_violations: violations,
            p_auto: !!auto,
          });
          if (error) throw error;
          if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
          $("scoreText").textContent = data.score + " / " + data.total;
          $("doneNote").textContent = auto ? "Your quiz was submitted automatically because you left the page too many times." : "Your answers have been recorded. You may close this page.";
          show("screen-done");
        } catch (e) {
          finished = false;
          active = true;
          $("submitBtn").disabled = false;
          $("quizErr").textContent = "Could not submit: " + (e.message || "network error") + ". Try again.";
        }
      }

      $("submitBtn").onclick = () => {
        const unanswered = questions.length - Object.keys(collect()).length;
        if (unanswered && !confirm(unanswered + " question(s) unanswered. Submit anyway?")) return;
        finish(false);
      };

      /* ---------- Anti-cheating: detect leaving the page ---------- */
      function flag(reason) {
        if (!active || finished) return;
        const now = Date.now();
        if (now - lastFlag < 1500) return; // one leave often fires several events
        lastFlag = now;
        violations++;
        $("wcount").textContent = violations;
        if (violations > MAX_WARNINGS) return finish(true);
        $("overlayMsg").textContent = "Warning " + violations + " of " + MAX_WARNINGS + ". Leaving again may submit your quiz automatically.";
        $("overlay").classList.remove("hidden");
      }
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) flag("hidden");
      });
      window.addEventListener("blur", () => flag("blur"));
      window.addEventListener("pagehide", () => flag("pagehide"));
      $("overlayBtn").onclick = () => {
        $("overlay").classList.add("hidden");
        if (document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      };

      // Deter copying / right-click
      ["contextmenu", "copy", "cut", "paste", "dragstart"].forEach((ev) =>
        document.addEventListener(ev, (e) => {
          if (active && e.target.tagName !== "INPUT") e.preventDefault();
        }),
      );

      // Warn before accidental refresh/close
      window.addEventListener("beforeunload", (e) => {
        if (active && !finished) {
          e.preventDefault();
          e.returnValue = "";
        }
      });
    </script>
  </body>
</html>
